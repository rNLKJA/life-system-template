<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2231"/>
      <stop offset="1" stop-color="#2a2c3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b87f5"/>
      <stop offset="1" stop-color="#7e69d6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.15">
    <path d="M0 200 L800 200 M0 400 L800 400 M0 600 L800 600 M0 800 L800 800" stroke="#9b87f5" stroke-width="1"/>
    <path d="M200 0 L200 1000 M400 0 L400 1000 M600 0 L600 1000" stroke="#9b87f5" stroke-width="1"/>
  </g>

  <!-- Central document stack -->
  <g transform="translate(200, 250)">
    <!-- Document 3 (back) -->
    <rect x="20" y="20" width="360" height="480" rx="12" fill="#2a2c3f" opacity="0.4"/>

    <!-- Document 2 (middle) -->
    <rect x="10" y="10" width="360" height="480" rx="12" fill="#2a2c3f" opacity="0.6" stroke="#9b87f5" stroke-width="1"/>

    <!-- Document 1 (front) -->
    <g filter="url(#glow)">
      <rect width="360" height="480" rx="12" fill="#2a2c3f" stroke="url(#accent)" stroke-width="2"/>

      <!-- Document content lines -->
      <g opacity="0.8">
        <rect x="40" y="50" width="140" height="8" rx="4" fill="#9b87f5"/>
        <rect x="40" y="80" width="280" height="4" rx="2" fill="#7e69d6"/>
        <rect x="40" y="95" width="260" height="4" rx="2" fill="#6b5bb8"/>
        <rect x="40" y="110" width="240" height="4" rx="2" fill="#5a4c9a"/>

        <rect x="40" y="150" width="100" height="6" rx="3" fill="#9b87f5"/>
        <rect x="40" y="175" width="280" height="3" rx="1.5" fill="#6b5bb8"/>
        <rect x="40" y="188" width="270" height="3" rx="1.5" fill="#5a4c9a"/>
        <rect x="40" y="201" width="250" height="3" rx="1.5" fill="#4a3d7f"/>

        <rect x="40" y="240" width="100" height="6" rx="3" fill="#9b87f5"/>
        <rect x="40" y="265" width="280" height="3" rx="1.5" fill="#6b5bb8"/>
        <rect x="40" y="278" width="260" height="3" rx="1.5" fill="#5a4c9a"/>

        <rect x="40" y="320" width="80" height="6" rx="3" fill="#9b87f5"/>
        <rect x="40" y="345" width="280" height="3" rx="1.5" fill="#6b5bb8"/>
        <rect x="40" y="358" width="270" height="3" rx="1.5" fill="#5a4c9a"/>
        <rect x="40" y="371" width="240" height="3" rx="1.5" fill="#4a3d7f"/>
        <rect x="40" y="384" width="230" height="3" rx="1.5" fill="#3a2d6f"/>
      </g>

      <!-- Folder icon -->
      <g transform="translate(280, 410)">
        <path d="M0 10 L0 50 A5 5 0 0 0 5 55 L55 55 A5 5 0 0 0 60 50 L60 15 A5 5 0 0 0 55 10 L25 10 L20 5 A5 5 0 0 0 15 0 L5 0 A5 5 0 0 0 0 5 Z" fill="#9b87f5" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- Floating particles -->
  <circle cx="150" cy="200" r="3" fill="#9b87f5" opacity="0.6"/>
  <circle cx="680" cy="350" r="2" fill="#7e69d6" opacity="0.5"/>
  <circle cx="120" cy="650" r="2.5" fill="#9b87f5" opacity="0.4"/>
  <circle cx="720" cy="750" r="3" fill="#6b5bb8" opacity="0.5"/>
</svg>
